name: CI

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Run actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Lint shell scripts
        run: shellcheck -o all resolve.sh share.sh load.sh cleanup.sh tests/*.sh

  test:
    name: Test resolve.sh
    runs-on: ubuntu-latest
    steps:
      - name: Run actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Exercise both decisions and the exported invocation
        run: ./tests/resolve.test.sh

  published:
    name: Use the action, published image
    runs-on: ubuntu-latest
    steps:
      - name: Run actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Resolve, with nothing to compare against
        id: dev
        uses: ./
        with:
          devcontainer-file: tests/fixture/devcontainer.json
          dockerfile: tests/fixture/Dockerfile
          image-inputs: tests/fixture/Dockerfile
          base-sha: "0000000000000000000000000000000000000000"
          docker-args: -e FIXTURE=reached
      - name: The output and the environment agree
        run: |
          test "${{ steps.dev.outputs.image }}" = "busybox:musl"
          test "${DEV_IMAGE}" = "busybox:musl"
      - name: The invocation runs, mounts the checkout and takes extra flags
        run: |
          test "$($DEV_RUN -c 'grep -c busybox:musl /workspace/tests/fixture/devcontainer.json')" = "1"
          test "$($DEV_RUN -c 'printf %s "${FIXTURE}"')" = "reached"

  candidate:
    name: Use the action, built candidate
    runs-on: ubuntu-latest
    steps:
      - name: Run actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Resolve, with a base that cannot be reached
        id: dev
        uses: ./
        with:
          devcontainer-file: tests/fixture/devcontainer.json
          dockerfile: tests/fixture/Dockerfile
          image-inputs: tests/fixture/Dockerfile
          base-sha: "deadbeefdeadbeefdeadbeefdeadbeefdeadbeef"
          workdir: /src
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: It built rather than pulled
        run: |
          test "${{ steps.dev.outputs.image }}" = "busybox:candidate"
          docker image inspect busybox:candidate >/dev/null
      - name: The built image runs at the configured workdir
        run: test "$($DEV_RUN -c 'grep -c busybox:musl /src/tests/fixture/devcontainer.json')" = "1"

  share:
    name: Share a built candidate
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.dev.outputs.image }}
      artifact: ${{ steps.dev.outputs.artifact }}
    steps:
      - name: Run actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Share, with a base that cannot be reached
        id: dev
        uses: ./share
        with:
          devcontainer-file: tests/fixture/devcontainer.json
          dockerfile: tests/fixture/Dockerfile
          image-inputs: tests/fixture/Dockerfile
          base-sha: "deadbeefdeadbeefdeadbeefdeadbeefdeadbeef"
          artifact: fixture-image
      - name: It hands on the published name and runs here in the candidate
        run: |
          test "${{ steps.dev.outputs.image }}" = "busybox:musl"
          test "${{ steps.dev.outputs.artifact }}" = "fixture-image"
          test "${DEV_IMAGE}" = "busybox:candidate"
          test "$($DEV_RUN -c 'cat /etc/dev-image-candidate')" = "candidate"

  share-nothing:
    name: Share nothing when nothing was built
    runs-on: ubuntu-latest
    steps:
      - name: Run actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Share, with nothing to compare against
        id: dev
        uses: ./share
        with:
          devcontainer-file: tests/fixture/devcontainer.json
          dockerfile: tests/fixture/Dockerfile
          image-inputs: tests/fixture/Dockerfile
          base-sha: "0000000000000000000000000000000000000000"
          artifact: fixture-image-unused
      - name: It names the pin and uploads nothing
        run: |
          test "${{ steps.dev.outputs.image }}" = "busybox:musl"
          test -z "${{ steps.dev.outputs.artifact }}"
          test "${DEV_IMAGE}" = "busybox:musl"

  share-without-upload:
    name: Share through a transfer of the caller's own
    runs-on: ubuntu-latest
    steps:
      - name: Run actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Share, without uploading
        id: dev
        uses: ./share
        with:
          devcontainer-file: tests/fixture/devcontainer.json
          dockerfile: tests/fixture/Dockerfile
          image-inputs: tests/fixture/Dockerfile
          base-sha: "deadbeefdeadbeefdeadbeefdeadbeefdeadbeef"
          artifact: fixture-image-unuploaded
          upload: "false"
      - name: It leaves the archive for the caller
        id: archive
        run: |
          test "${{ steps.dev.outputs.artifact }}" = "fixture-image-unuploaded"
          test -s "${{ steps.dev.outputs.path }}"
          echo "dir=$(dirname "${{ steps.dev.outputs.path }}")" >>"${GITHUB_OUTPUT}"
      - name: Resolve, from the directory
        id: use
        uses: ./
        with:
          image: ${{ steps.dev.outputs.image }}
          artifact: ${{ steps.dev.outputs.artifact }}
          artifact-path: ${{ steps.archive.outputs.dir }}
      - name: It runs in the loaded candidate
        run: |
          test "${{ steps.use.outputs.image }}" = "busybox:musl"
          test "$($DEV_RUN -c 'cat /etc/dev-image-candidate')" = "candidate"
          test ! -e "${{ steps.dev.outputs.path }}"

  use-shared:
    name: Use the shared candidate
    needs: [share]
    runs-on: ubuntu-latest
    steps:
      - name: Run actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Resolve, from the artifact
        id: dev
        uses: ./
        with:
          image: ${{ needs.share.outputs.image }}
          artifact: ${{ needs.share.outputs.artifact }}
          dockerfile: tests/fixture/Dockerfile
          image-inputs: tests/fixture/Dockerfile
          base-sha: "deadbeefdeadbeefdeadbeefdeadbeefdeadbeef"
      - name: It runs in the candidate without building one
        run: |
          test "${{ steps.dev.outputs.image }}" = "busybox:musl"
          test "$($DEV_RUN -c 'cat /etc/dev-image-candidate')" = "candidate"
          if docker image inspect busybox:candidate >/dev/null 2>&1; then exit 1; fi

  cleanup:
    name: Delete the shared candidate
    needs: [share, use-shared]
    if: always() && needs.share.outputs.artifact != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Run actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Delete the artifact
        uses: ./cleanup
        with:
          artifact: ${{ needs.share.outputs.artifact }}
      - name: It is gone from the run
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT: ${{ needs.share.outputs.artifact }}
        run: |
          left="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
            --jq "[.artifacts[] | select(.name == \"${ARTIFACT}\")] | length")"
          test "${left}" = "0"
